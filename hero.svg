<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Harsh Dubey animated banner">
<title>Harsh Dubey — MCA Student • Web Developer • AI Enthusiast</title>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0d1117"/>
    <stop offset="100%" stop-color="#161b22"/>
  </linearGradient>
  <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#238636">
      <animate attributeName="stop-color" values="#238636;#1f6feb;#8957e5;#d03592;#238636" dur="6s" repeatCount="indefinite"/>
    </stop>
    <stop offset="50%" stop-color="#1f6feb">
      <animate attributeName="stop-color" values="#1f6feb;#8957e5;#d03592;#238636;#1f6feb" dur="6s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#8957e5">
      <animate attributeName="stop-color" values="#8957e5;#d03592;#238636;#1f6feb;#8957e5" dur="6s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>
  <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#39d353"/>
    <stop offset="25%" stop-color="#58a6ff"/>
    <stop offset="50%" stop-color="#bc8cff"/>
    <stop offset="75%" stop-color="#ff7b72"/>
    <stop offset="100%" stop-color="#39d353"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="-300 0" to="300 0" dur="3.5s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="subtleGlow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  <clipPath id="roundClip"><rect x="0" y="0" width="900" height="280" rx="16"/></clipPath>
</defs>

<!-- background -->
<rect width="900" height="280" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8"/>
<rect x="1" y="1" width="898" height="278" rx="16" fill="none" stroke="#30363d" stroke-width="0.6" opacity="0.5"/>

<!-- dot grid pattern -->
<g opacity="0.35">
  <circle cx="28" cy="22" r="1.2" fill="#30363d"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="56" cy="22" r="1.2" fill="#30363d"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="84" cy="22" r="1.2" fill="#30363d"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.3s" repeatCount="indefinite"/></circle>
  <circle cx="872" cy="22" r="1.2" fill="#30363d"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.9s" repeatCount="indefinite"/></circle>
  <circle cx="844" cy="22" r="1.2" fill="#30363d"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.3s" repeatCount="indefinite"/></circle>
  <circle cx="816" cy="22" r="1.2" fill="#30363d"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.6s" repeatCount="indefinite"/></circle>
</g>

<!-- window chrome -->
<circle cx="30" cy="30" r="6" fill="#ff5f56"/>
<circle cx="50" cy="30" r="6" fill="#ffbd2e"/>
<circle cx="70" cy="30" r="6" fill="#27c93f"/>
<text x="450" y="34" text-anchor="middle" fill="#7d8590" font-family="ui-monospace,Consolas,monospace" font-size="12">harsh@harsh-dubey — ~/profile • zsh</text>

<!-- subtle top glow line -->
<rect x="40" y="52" width="820" height="1" fill="url(#borderGrad)" opacity="0.6"/>
<rect x="40" y="53" width="820" height="18" fill="url(#subtleGlow)" opacity="0.7"/>

<!-- wave hand -->
<g transform="translate(118,128)">
  <text font-size="38" text-anchor="middle" dominant-baseline="middle">
    <tspan>👋</tspan>
    <animateTransform attributeName="transform" type="rotate" values="0 0 0;-18 0 0;12 0 0;-8 0 0;0 0 0" keyTimes="0;0.2;0.45;0.7;1" dur="2.2s" repeatCount="indefinite" additive="sum"/>
  </text>
  <!-- hand glow -->
  <circle r="28" fill="#f0883e" opacity="0"><animate attributeName="opacity" values="0;0.08;0" dur="2.2s" repeatCount="indefinite"/><animate attributeName="r" values="22;34;22" dur="2.2s" repeatCount="indefinite"/></circle>
</g>

<!-- Hi IAM text -->
<text x="150" y="118" fill="#8b949e" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="600">Hi, I'm</text>

<!-- Name with gradient + glow -->
<text x="150" y="168" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5" fill="url(#nameGrad)" filter="url(#glow)">Harsh Dubey
  <animate attributeName="opacity" values="1;1;1" dur="1s" repeatCount="indefinite"/>
</text>
<!-- underline animated -->
<rect x="150" y="176" width="345" height="3" rx="1.5" fill="url(#borderGrad)" opacity="0.9">
  <animate attributeName="width" values="0;345;345;0;0" keyTimes="0;0.35;0.6;0.85;1" dur="4s" repeatCount="indefinite"/>
</rect>

<!-- typing roles -->
<g font-family="ui-monospace,Consolas,monospace" font-size="15.5" font-weight="600">
  <text x="150" y="205" fill="#58a6ff" opacity="1">▸ MCA Student
    <animate attributeName="opacity" values="1;1;0;0;0;0;0;0" keyTimes="0;0.22;0.25;0.47;0.50;0.72;0.75;1" dur="10s" repeatCount="indefinite"/>
  </text>
  <text x="150" y="205" fill="#3fb950" opacity="0">▸ Web Developer
    <animate attributeName="opacity" values="0;0;1;1;0;0;0;0" keyTimes="0;0.22;0.25;0.47;0.50;0.72;0.75;1" dur="10s" repeatCount="indefinite"/>
  </text>
  <text x="150" y="205" fill="#bc8cff" opacity="0">▸ AI &amp; Full-Stack Enthusiast
    <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" keyTimes="0;0.22;0.25;0.47;0.50;0.72;0.75;1" dur="10s" repeatCount="indefinite"/>
  </text>
  <text x="150" y="205" fill="#f0883e" opacity="0">▸ Building SkillNexAI 🚀
    <animate attributeName="opacity" values="0;0;0;0;0;0;1;1" keyTimes="0;0.22;0.25;0.47;0.50;0.72;0.75;1" dur="10s" repeatCount="indefinite"/>
  </text>
</g>

<!-- cursor -->
<rect x="365" y="192" width="9" height="18" rx="1" fill="#c9d1d9">
  <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.5;1" dur="0.9s" repeatCount="indefinite"/>
  <animate attributeName="x" values="278;298;382;372" keyTimes="0;0.25;0.50;0.75" dur="10s" repeatCount="indefinite"/>
</rect>

<!-- right side: code window mini -->
<g transform="translate(560,88)">
  <rect width="300" height="148" rx="10" fill="#010409" stroke="#30363d" stroke-width="1"/>
  <rect x="0" y="0" width="300" height="24" rx="10" fill="#161b22"/>
  <rect x="0" y="18" width="300" height="6" fill="#161b22"/>
  <circle cx="16" cy="12" r="4" fill="#ff5f56"/><circle cx="32" cy="12" r="4" fill="#ffbd2e"/><circle cx="48" cy="12" r="4" fill="#27c93f"/>
  <text x="150" y="16" text-anchor="middle" fill="#7d8590" font-family="ui-monospace,Consolas,monospace" font-size="8">harsh.js</text>
  <!-- code lines with typing wipe -->
  <g font-family="ui-monospace,Consolas,monospace" font-size="9.5">
    <text x="14" y="42" fill="#8b949e"><tspan fill="#ff7b72">const</tspan> <tspan fill="#79c0ff">harsh</tspan> <tspan fill="#c9d1d9">= {</tspan></text>
    <text x="22" y="58" fill="#c9d1d9"><tspan fill="#7ee787">name</tspan>: <tspan fill="#a5d6ff">"Harsh Dubey"</tspan>,</text>
    <text x="22" y="74" fill="#c9d1d9"><tspan fill="#7ee787">role</tspan>: <tspan fill="#a5d6ff">"Full-Stack Dev"</tspan>,</text>
    <text x="22" y="90" fill="#c9d1d9"><tspan fill="#7ee787">focus</tspan>: [<tspan fill="#a5d6ff">"AI"</tspan>, <tspan fill="#a5d6ff">"Web"</tspan>],</text>
    <text x="22" y="106" fill="#c9d1d9"><tspan fill="#7ee787">status</tspan>: <tspan fill="#ffab70">"building"</tspan><tspan fill="#ff7b72"> 🚀</tspan></text>
    <text x="14" y="122" fill="#c9d1d9">}</text>
    <text x="14" y="138" fill="#58a6ff">harsh.ship(<tspan fill="#a5d6ff">"SkillNexAI"</tspan>);</text>
  </g>
  <!-- scanline -->
  <rect x="8" y="36" width="284" height="1.5" fill="#58a6ff" opacity="0">
    <animate attributeName="opacity" values="0;0.4;0" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="y" values="36;126;36" dur="3s" repeatCount="indefinite"/>
  </rect>
  <!-- glow pulse on window -->
  <rect width="300" height="148" rx="10" fill="none" stroke="url(#borderGrad)" stroke-width="1" opacity="0.0">
    <animate attributeName="opacity" values="0;0.6;0" dur="3s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- floating particles -->
<g opacity="0.9">
  <circle cx="200" cy="230" r="2" fill="#58a6ff"><animate attributeName="cy" values="230;222;230" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="520" cy="240" r="1.6" fill="#bc8cff"><animate attributeName="cy" values="240;232;240" dur="2.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.9s" repeatCount="indefinite"/></circle>
  <circle cx="700" cy="70" r="1.4" fill="#39d353"><animate attributeName="cy" values="70;62;70" dur="2.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.1s" repeatCount="indefinite"/></circle>
  <circle cx="760" cy="200" r="1.8" fill="#ff7b72"><animate attributeName="cy" values="200;192;200" dur="2.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0.25;0.8" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="120" cy="200" r="1.3" fill="#f0883e"><animate attributeName="cy" values="200;193;200" dur="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.2s" repeatCount="indefinite"/></circle>
</g>

<!-- bottom tagline -->
<text x="450" y="258" text-anchor="middle" fill="#7d8590" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="0.8">Building • Learning • Improving • Shipping  🚀  —  Open to collaboration</text>
<text x="450" y="270" text-anchor="middle" fill="#30363d" font-family="ui-monospace,Consolas,monospace" font-size="7" letter-spacing="1.5">MCA @ LIET  •  WEB  •  AI  •  FULL-STACK</text>
</svg>