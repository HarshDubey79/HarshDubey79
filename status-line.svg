<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 56" role="img" aria-label="Harsh Dubey: building web apps, exploring AI and open to collaboration">
<title>Harsh Dubey — building, learning, collaborating</title>
<defs>
  <linearGradient id="sBorder" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#238636"><animate attributeName="stop-color" values="#238636;#1f6feb;#8957e5;#238636" dur="5s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#1f6feb"><animate attributeName="stop-color" values="#1f6feb;#8957e5;#238636;#1f6feb" dur="5s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <filter id="sGlow"><feGaussianBlur stdDeviation="3"/><feComposite in="SourceGraphic" operator="over"/></filter>
</defs>
<rect x="0.5" y="0.5" width="619" height="55" rx="12" fill="#0d1117" stroke="url(#sBorder)" stroke-width="1.2"/>
<rect x="0.5" y="0.5" width="619" height="55" rx="12" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.4"/>

<!-- pulsing dot with glow -->
<circle cx="22" cy="28" r="6" fill="#39d353" opacity="0.18"><animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.18;0;0.18" dur="2s" repeatCount="indefinite"/></circle>
<circle cx="22" cy="28" r="5" fill="#39d353"><animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/></circle>

<text x="38" y="32" fill="#7d8590" font-family="ui-monospace,Consolas,monospace" font-size="13">harsh@github:~$</text>

<g font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="600">
  <text x="164" y="32" fill="#58a6ff">building web apps
    <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.28;0.32;0.63;0.66;0.98;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="164" y="32" fill="#3fb950" opacity="0">exploring AI ✨
    <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.28;0.32;0.63;0.66;0.98;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="164" y="32" fill="#bc8cff" opacity="0">open to collaboration 🤝
    <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.28;0.32;0.63;0.66;0.98;1" dur="9s" repeatCount="indefinite"/>
  </text>
</g>

<!-- shimmer cursor -->
<rect x="400" y="19" width="8" height="17" rx="1.5" fill="#c9d1d9">
  <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.48;0.5;1" dur="1s" repeatCount="indefinite"/>
  <animate attributeName="x" values="322;276;366;322" keyTimes="0;0.30;0.62;0.85" dur="9s" repeatCount="indefinite"/>
</rect>

<!-- bottom accent dash that slides -->
<rect x="38" y="42" width="90" height="2" rx="1" fill="url(#sBorder)" opacity="0.85">
  <animate attributeName="x" values="38;480;38" dur="4s" repeatCount="indefinite"/>
  <animate attributeName="width" values="90;40;90" dur="4s" repeatCount="indefinite"/>
</rect>
</svg>