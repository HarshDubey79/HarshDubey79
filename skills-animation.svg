<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 60" role="img" aria-label="Skill progress animation">
<title>Skill progress animation</title>
<defs>
  <linearGradient id="pBorder" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#238636"><animate attributeName="stop-color" values="#238636;#1f6feb;#8957e5;#d03592;#238636" dur="6s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#1f6feb"><animate attributeName="stop-color" values="#1f6feb;#8957e5;#d03592;#238636;#1f6feb" dur="6s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#238636"/><stop offset="50%" stop-color="#1f6feb"/><stop offset="100%" stop-color="#8957e5"/>
  </linearGradient>
</defs>
<rect x="0.5" y="0.5" width="619" height="59" rx="12" fill="#0d1117" stroke="url(#pBorder)" stroke-width="1.2"/>
<rect x="0.5" y="0.5" width="619" height="59" rx="12" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.4"/>

<!-- Header -->
<text x="20" y="22" fill="#7d8590" font-family="ui-monospace,Consolas,monospace" font-size="12">harsh@github:~$</text>
<text x="160" y="22" fill="#c9d1d9" font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="600">npm run build-skills</text>

<!-- Skill bars container -->
<g font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="600">

  <!-- React -->
  <text x="20" y="40" fill="#58a6ff">React</text>
  <rect x="80" y="30" width="180" height="8" rx="4" fill="#161b22" stroke="#30363d"/>
  <rect x="80" y="30" width="0" height="8" rx="4" fill="url(#barGrad)">
    <animate attributeName="width" values="0;144;144;0" keyTimes="0;0.4;0.6;1" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="270" y="36" fill="#8b949e" font-size="10" opacity="0">90%</text>
  <text x="270" y="36" fill="#8b949e" font-size="10">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.4;0.6;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="270;270;270;270" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="270" y="36" fill="#8b949e" font-size="10">90%</text>

  <!-- Next.js -->
  <text x="20" y="54" fill="#c9d1d9">Next.js</text>
  <rect x="80" y="44" width="180" height="8" rx="4" fill="#161b22" stroke="#30363d"/>
  <rect x="80" y="44" width="0" height="8" rx="4" fill="url(#barGrad)">
    <animate attributeName="width" values="0;135;135;0" keyTimes="0;0.4;0.6;1" dur="4s" begin="0.8s" repeatCount="indefinite"/>
  </rect>
  <text x="270" y="50" fill="#8b949e" font-size="10">85%</text>

  <!-- TypeScript -->
  <text x="320" y="40" fill="#007ACC">TypeScript</text>
  <rect x="420" y="30" width="180" height="8" rx="4" fill="#161b22" stroke="#30363d"/>
  <rect x="420" y="30" width="0" height="8" rx="4" fill="url(#barGrad)">
    <animate attributeName="width" values="0;153;153;0" keyTimes="0;0.4;0.6;1" dur="4s" begin="1.6s" repeatCount="indefinite"/>
  </rect>
  <text x="610" y="36" fill="#8b949e" font-size="10">95%</text>

  <!-- Node.js -->
  <text x="320" y="54" fill="#5FA04E">Node.js</text>
  <rect x="420" y="44" width="180" height="8" rx="4" fill="#161b22" stroke="#30363d"/>
  <rect x="420" y="44" width="0" height="8" rx="4" fill="url(#barGrad)">
    <animate attributeName="width" values="0;126;126;0" keyTimes="0;0.4;0.6;1" dur="4s" begin="2.4s" repeatCount="indefinite"/>
  </rect>
  <text x="610" y="50" fill="#8b949e" font-size="10">80%</text>

</g>

<!-- Moving particles -->
<circle cx="580" cy="15" r="2" fill="#58a6ff" opacity="0.6">
  <animate attributeName="cy" values="15;10;15" dur="3s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
</circle>
<circle cx="590" cy="25" r="1.5" fill="#8957e5" opacity="0.5">
  <animate attributeName="cy" values="25;20;25" dur="2.5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.5s" repeatCount="indefinite"/>
</circle>

</svg>